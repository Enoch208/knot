[project]
name = "KNOT YieldScout"

[stack]
runtime = "agentcore"
protocols = ["A2A"]

[network]
default = "bsc-testnet"

[wallet]
kind = "evm-local"
signer = "local"
keystore_dir = "../../.studio/wallets"
address = "0x6fD04720c7FcCB6dCEBf6cF08dD6f5C764c7D8E3"

[payments.erc8183]
currency = "0xc70B8741B8B07A6d61E54fd4B20f22Fa648E5565"
price = "100000000000000000"
min_price = "0"
max_price = "100000000000000000"
quote_ttl_seconds = 900
default_estimated_completion_seconds = 600
poll_interval_seconds = 30
auto_settle = false

[storage]
kind = "s3"
bucket = "knot-deliverables"
region = "us-east-1"
key_prefix = "yieldscout"
public_base_url = "https://knot-artifacts.truematchx.com/knot-deliverables"
endpoint = "http://object-store:9000"
credential_mode = "env"
